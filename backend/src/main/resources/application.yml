spring:
  application:
    name: dailyquest
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/dailyquest?useUnicode=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: ${SHOW_SQL:false}
    show-sql: ${SHOW_SQL:false}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

jwt:
  secret: ${JWT_SECRET:dailyquest-secret-key-change-this-in-production-must-be-at-least-256-bits-long-for-security}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
  allowed-headers: "*"

app:
  frontend-url: ${FRONTEND_URL:${APP_FRONTEND_URL:http://localhost:3000}}
  monitoring:
    slow-request-threshold-ms: ${SLOW_REQUEST_THRESHOLD_MS:1000}
    actuator:
      username: ${ACTUATOR_USERNAME:actuator}
      password: ${ACTUATOR_PASSWORD:actuator-local-password}
  mail:
    from: ${MAIL_FROM:no-reply@dailyquest.local}
  password-reset:
    token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:30}

# Swagger 설정
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
